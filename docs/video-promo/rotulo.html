<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
html, body { background: transparent; }
.chip { position: absolute; left: 70px; top: 1300px; display: inline-flex; align-items: center; gap: 22px; background: rgba(12,45,92,.92); color: #fff; font-weight: 800; font-size: 60px; border-radius: 999px; padding: 22px 48px 22px 36px; box-shadow: 0 12px 30px rgba(0,0,0,.25); }
.chip i { width: 18px; height: 18px; border-radius: 50%; background: #f2b01e; }
.titular { position: absolute; left: 0; right: 0; top: 300px; text-align: center; color: #fff; font-weight: 800; font-size: 88px; line-height: 1.1; text-shadow: 0 4px 24px rgba(0,0,0,.55), 0 2px 4px rgba(0,0,0,.5); }
</style>
<p class="titular" id="t"></p>
<p class="chip" id="c"><i></i><span id="ct"></span></p>
<script>
const q = new URLSearchParams(location.search);
document.getElementById("ct").textContent = q.get("c") || "";
if (!q.get("c")) document.getElementById("c").remove();
document.getElementById("t").innerHTML = q.get("t") || "";
</script>
